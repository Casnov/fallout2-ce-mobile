<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <meta name="theme-color" content="#050A06">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fallout 2">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <title>Fallout 2 CE Mobile</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./import-native.css">
  <script defer src="./fallout2-ce.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body class="startup">
  <div id="safe-area" aria-hidden="true"></div>
  <main id="launcher">
    <section id="panel" aria-labelledby="title">
      <h1 id="title">Fallout 2</h1>
      <div id="content">
        <p id="message" role="status" aria-live="polite">Checking game files…</p>
        <p id="dev-note" hidden></p>
      </div>
      <progress id="progress" hidden aria-label="Loading"></progress>
      <button id="play" type="button" hidden>Play</button>
      <button id="retry" type="button" hidden>Try again</button>
      <a id="repair" href="./files.html" hidden>Game files</a>
      <footer id="startup-tools">
        <span id="build-tag"></span>
      </footer>
    </section>
  </main>
  <canvas id="canvas" tabindex="-1" aria-label="Fallout 2"></canvas>
  <section id="save-exchange" role="dialog" aria-modal="true" aria-label="Сохранения" hidden></section>
  <form id="text-editor" autocomplete="off">
    <input id="text-input" type="text" hidden autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Game text">
  </form>
  <output id="diagnostics" hidden></output>
  <output id="storage-warning" role="alert" hidden></output>
  <div id="rotate" role="status" hidden>Turn the device to landscape</div>
  <noscript>JavaScript is required to run Fallout 2.</noscript>
</body>
</html>
