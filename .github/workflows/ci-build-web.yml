name: Build webassembly version

# The port: only builds the engine with Emscripten (does the code compile
# for the browser). Upstream's web launcher and its GitHub Pages deploy are
# not used by the port.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build_webassembly_version:
    name: Build webassembly version
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 4.0.4
          ./emsdk activate 4.0.4

      - name: Build fallout2 wasm module
        run: |
          source emsdk/emsdk_env.sh
          git config --global --add safe.directory "*"
          mkdir -p build
          cd build
          emcmake cmake ../ -DCMAKE_TOOLCHAIN_FILE=../cmake/toolchain/Emscripten.cmake -DCMAKE_BUILD_TYPE=Release && emmake make VERBOSE=1 -j 4
          cd ..
